name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js from secret
        run: |
          cat > config.js << 'EOF'
          window.FIREBASE_CONFIG = ${{ secrets.FIREBASE_CONFIG }};
          EOF

      - name: Remove .gitignore so config.js isn't excluded from deploy
        run: rm -f .gitignore

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
